services:
  db:
    container_name: go_boiler_db
    image: postgres:18
    ports:
      - "6123:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: test1
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test1 -d test1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: go_boiler_redis
    image: redis:latest
    command: ["redis-server", "--requirepass", "test"]
    ports:
      - "7123:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "test", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

