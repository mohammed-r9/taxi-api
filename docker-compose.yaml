services:
  db:
    container_name: taxi_api_postgres
    image: postgis/postgis:18-3.6
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-postgis.sql:/docker-entrypoint-initdb.d/10-postgis.sql:ro
    environment:
      POSTGRES_USER: ${DB_USER:-test1}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-test}
      POSTGRES_DB: ${DB_NAME:-test1}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-test1} -d ${DB_NAME:-test1}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: taxi_api_redis
    image: redis:latest
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-test}"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD:-test}' ping"]
      interval: 10s
      timeout: 5s
      retries: 5

