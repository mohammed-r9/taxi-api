version: "2"

sql:
  - engine: "postgresql"
    queries: "./queries"
    schema: "./migrations"
    gen:
      go:
        package: "db"
        out: "./db"
        emit_prepared_queries: false
        json_tags_case_style: "snake"
        omit_unused_structs: true
        emit_interface: true
        emit_empty_slices: true
        emit_json_tags: true
        emit_pointers_for_null_types: true
        sql_package: "pgx/v5"
        sql_driver: "github.com/jackc/pgx/v5"

        overrides:
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"

          - db_type: "uuid"
            go_type:
              import: "uuid"
              type: "UUID"

          - db_type: "uuid"
            nullable: true
            go_type:
              import: "uuid"
              type: "UUID"
              pointer: true

          - db_type: "pg_catalog.timestamp"
            go_type:
              import: "time"
              type: "Time"

          - db_type: "pg_catalog.timestamp"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true

          - db_type: "pg_catalog.numeric"
            go_type: "float64"

          - db_type: "pg_catalog.interval"
            go_type:
              import: "time"
              type: "Duration"

          - db_type: "pg_catalog.int4"
            go_type: "int"

          - db_type: "pg_catalog.int4"
            nullable: true
            go_type:
              type: "int"
              pointer: true

          - db_type: "serial"
            go_type: "int"

          - db_type: "pg_catalog.text"
            go_type: "string"

          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"

          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true

          - db_type: "date"
            go_type:
              import: "time"
              type: "Time"

          - db_type: "date"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
